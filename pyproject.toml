[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "func-sqrt"
version = "0.2.0"
description = "関数的平方根 g(g(x)) = f(x) のテイラー展開を sympy で厳密計算するツール"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["sympy>=1.10"]
keywords = ["functional square root", "iterative root", "fractional iteration", "taylor series", "sympy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
func-sqrt = "func_sqrt.cli:main"

[tool.setuptools]
packages = ["func_sqrt"]

[tool.pytest.ini_options]
testpaths = ["tests", "func_sqrt"]
addopts = "--doctest-modules"
